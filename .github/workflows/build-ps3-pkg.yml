# Build PS3 PKG (prototype: bilinear texture filtering)
# Repo: fendimaharsi0-sketch/another_pcsx_rearmed_for_ps3, branch ps3
# Paste this file as .github/workflows/build-ps3-pkg.yml in the web UI,
# then: Actions -> Build PS3 PKG -> Run workflow -> download the artifact.
#
# Why this shape:
# - workflow_dispatch ONLY (no push trigger): a toolchain build is hours on
#   a cold cache, it must never run on every push by accident.
# - Toolchain is built from ps3dev/ps3toolchain source (steps 001-007, the
#   same steps as ps3toolchain's own CI), NOT from the old GCC 7.2 libretro
#   image: this repo's SPU code needs a modern GCC (SPU 9.5 is the last GCC
#   with SPU support; PPU 13.2). The old image fails spu/mdec_spu.c.
# - The toolchain folder (ps3dev) is cached by toolchain commit SHA, so the
#   first run builds it (run #1 took 13m27s for steps 001/002/004/005/006,
#   no GDB) and later runs restore it from cache and skip straight to
#   PSL1GHT + the pkg build.
# - FIX 2026-11-02 (run #1 failure): sprxlinker / make_self_npdrm / sfo /
#   pkg are PSL1GHT host tools, NOT ps3toolchain outputs. Checking them in
#   "Verify toolchain" (before PSL1GHT is built) always fails. They are
#   now checked only after the PSL1GHT install step, where they belong.
# - FIX 2026-11-02 (run #2 failure, exit 126): build.sh lost its +x bit in
#   the fork (100644, not 100755) because the API snapshot push does not
#   preserve file modes. The Build PKG step now chmod +x first.
# - Cache note (run #2): the toolchain was rebuilt (16m49s) despite run
#   #1's cache save, so the cache key (ps3toolchain HEAD SHA) had moved
#   or the save did not persist. A cache hit is a shortcut, not a
#   guarantee: if upstream ps3toolchain moves, the next run rebuilds.
# - PSL1GHT is built fresh every run (minutes, not hours), so the RSX patch
#   below is always applied to a clean tree. The patch step is idempotent:
#   it skips itself if the header already contains the clobber.
# - Cg comes from the Ubuntu package (nvidia-cg-toolkit), the same package
#   used to verify all 58 shaders locally. No other shader tool is needed.
# - FIX 2026-11-03 (run #17 failure, exit 134): PSL1GHT's pkg tool
#   (tools/sfo_pkg/pkg.c) caps packages at MAX_FILES 1024 and fills
#   per-directory stack arrays without a bounds check; our package holds
#   4502 entries (4497 cheat files + EBOOT/SFO/ICON0/PIC1/ps1titles), so
#   the stock tool aborts with "*** buffer overflow detected ***" /
#   "*** stack smashing detected ***" while packing. The PSL1GHT step now
#   patches MAX_FILES to 8192 and moves the collection arrays to static
#   storage before building. Verified locally: stock pkg.c aborts (exit
#   134) on the real cheat set, patched pkg.c packs all 4497 cheats in
#   ~2.4 s. The patch is inline (heredoc) so no repo file is needed; if
#   upstream changes pkg.c, the patch step fails loudly (patch exits
#   non-zero) instead of silently misbuilding.
# - Output is ONLY an Actions artifact, not a Release: the pkg is untested
#   on PS3 hardware until Fendi runs it. Do not turn this into a release
#   job until a hardware test passes.
# - UNTESTED workflow: the first run is the test. If a step fails, read its
#   log, fix that step, re-run. Do not assume it works before a green run
#   produces a .pkg artifact.

name: Build PS3 PKG

on:
  workflow_dispatch:
    inputs:
      pkg_name:
        description: 'Package file name (without .pkg)'
        default: 'pcsx-rearmed-ps3-texfilter'
        required: false
      dynarec:
        description: 'DYNAREC for the core build (lightrec or 0 for interpreter)'
        default: 'lightrec'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev
      BUILD_PS3TOOLCHAIN_ONLY: '1'
      NO_SAVANNAH: '1'

    steps:
      - name: Checkout prototype (branch ps3)
        uses: actions/checkout@v4
        with:
          ref: ps3

      - name: Install host dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get -y install \
            autoconf automake bison flex gcc libelf-dev make texinfo \
            libncurses5-dev patch python3 python-is-python3 subversion \
            wget zlib1g-dev libtool-bin python3-dev bzip2 libgmp3-dev \
            pkg-config libssl-dev clang git nvidia-cg-toolkit
          echo "PATH=$GITHUB_WORKSPACE/ps3dev/bin:$GITHUB_WORKSPACE/ps3dev/ppu/bin:$GITHUB_WORKSPACE/ps3dev/spu/bin:$PATH" >> "$GITHUB_ENV"

      - name: Clone ps3toolchain and record its SHA
        id: toolchain
        run: |
          set -eux
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git ps3toolchain
          echo "sha=$(cd ps3toolchain && git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore cached toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ps3dev
          key: ps3dev-toolchain-${{ steps.toolchain.outputs.sha }}

      - name: Download toolchain archives
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        working-directory: ps3toolchain
        run: |
          set -eux
          ./download.sh

      - name: Build toolchain (PPU binutils + GCC/newlib, SPU binutils + GCC/newlib)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        working-directory: ps3toolchain
        run: |
          set -eux
          ./toolchain.sh 001
          ./toolchain.sh 002
          ./toolchain.sh 004
          ./toolchain.sh 005
          ./toolchain.sh 006
          # Note: steps 003/007 (GDB) are skipped on purpose: build.sh does
          # not need GDB, and skipping them saves a large chunk of time.

      - name: Verify toolchain
        # ONLY the compilers here: sprxlinker / make_self_npdrm / sfo / pkg
        # do not exist yet at this point, they are installed by the PSL1GHT
        # step below (run #1 failed exactly on that mistaken check).
        run: |
          set -eux
          ls "$PS3DEV/ppu/bin" | grep -E '^ppu-.*gcc$' || true
          "$PS3DEV/ppu/bin/ppu-gcc" --version | head -1
          "$PS3DEV/spu/bin/spu-gcc" --version | head -1

      - name: Clone PSL1GHT, apply RSX patch, build and install it
        run: |
          set -eux
          git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git PSL1GHT
          # The patch lives in this repo at psl1ght-patches/ (repo root).
          # build.sh refuses to run without it: without the "memory" clobber,
          # GCC 11+ miscompiles the RSX command-buffer callback and the GPU
          # hangs at the first buffer wrap.
          if grep -q '"memory"' PSL1GHT/ppu/include/rsx/rsx_function_macros.h; then
            echo "RSX patch already present, skipping"
          else
            patch -p1 -d PSL1GHT < psl1ght-patches/0001-rsx-context-callback-clobbers.patch
          fi
          grep -q '"memory"' PSL1GHT/ppu/include/rsx/rsx_function_macros.h
          # FIX 2026-11-03 (run #17 failure, exit 134): raise PSL1GHT's pkg
          # file cap from 1024 to 8192 and move its per-directory collection
          # arrays off the stack, otherwise packing our 4502-entry package
          # aborts the tool. Inline patch (no repo file needed); fails
          # loudly if upstream pkg.c changes underneath us.
          patch -p1 -d PSL1GHT <<'PKG_MAX_FILES_EOF'
          diff --git a/tools/sfo_pkg/pkg.c b/tools/sfo_pkg/pkg.c
          --- a/tools/sfo_pkg/pkg.c
          +++ b/tools/sfo_pkg/pkg.c
          @@ -281,7 +281,7 @@ static void make_dirs(const char *path)
           /* ------------------------------------------------------------------ */
           
           /* Maximum number of entries in a PKG */
          -#define MAX_FILES 1024
          +#define MAX_FILES 8192
           
           static pkg_file_entry_t g_files[MAX_FILES];
           static int              g_file_count = 0;
          @@ -299,8 +299,8 @@ static void get_files(const char *folder, const char *original)
               if (h == INVALID_HANDLE_VALUE) return;
           
               /* Collect entries: files first, then directories */
          -    char files_list[MAX_FILES][260];
          -    char dirs_list[MAX_FILES][260];
          +    static char files_list[MAX_FILES][260];
          +    static char dirs_list[MAX_FILES][260];
               int  nfiles = 0, ndirs = 0;
           
               do {
          @@ -373,8 +373,8 @@ static void collect_dir(const char *folder, const char *original)
               if (!dp) { perror(folder); return; }
           
               /* Collect names */
          -    char files_list[MAX_FILES][512];
          -    char dirs_list[MAX_FILES][512];
          +    static char files_list[MAX_FILES][512];
          +    static char dirs_list[MAX_FILES][512];
               int  nfiles = 0, ndirs = 0;
           
               size_t foldlen = strlen(folder);
          PKG_MAX_FILES_EOF
          grep -q 'define MAX_FILES 8192' PSL1GHT/tools/sfo_pkg/pkg.c
          cd PSL1GHT
          make install-ctrl
          make
          make install
          # PSL1GHT host tools, checked here (after install) not earlier:
          test -x "$PS3DEV/bin/cgcomp"
          test -x "$PS3DEV/bin/sprxlinker"
          test -x "$PS3DEV/bin/make_self_npdrm"
          test -x "$PS3DEV/bin/sfo"
          test -x "$PS3DEV/bin/pkg"

      - name: Build the PKG
        working-directory: ps3
        env:
          DYNAREC: ${{ inputs.dynarec }}
        run: |
          set -eux
          # FIX 2026-11-02 (run #2 failure, exit 126 "Permission denied"):
          # build.sh is 100755 in the source tree, but the prototype push
          # (GitHub API snapshot push) stored it as 100644 in the fork, so
          # ./build.sh cannot execute after checkout. chmod here makes the
          # workflow immune to that mode loss on every future push too.
          chmod +x ./build.sh
          ./build.sh "${{ inputs.pkg_name }}"
          ls -lh "build/${{ inputs.pkg_name }}.pkg"

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pkg_name }}-pkg
          path: ps3/build/*.pkg
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pkg_name }}-logs
          path: |
            ps3/build/core.log
            ps3/build/gen
          if-no-files-found: ignore
